# DriveLocal — containerised backend + optional Caddy HTTPS front.
#
# Quick start (no domain, local test on http://localhost:4000):
#   cp backend/.env.example backend/.env   # then add your real secrets
#   docker compose up --build app
#
# Production (Caddy auto-provisions a Let's Encrypt certificate):
#   1. Point your domain at this host and set APP_DOMAIN below.
#   2. Create backend/.env per the checklist in DEPLOY.md.
#   3. docker compose up --build  (services: `app` and `caddy`)

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_FILE: /data/drivelocal.sqlite
      UPLOADS_DIR: /data/uploads
    volumes:
      - drivelocal-data:/data
      - drivelocal-backups:/app/backups
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional reverse proxy that brings real HTTPS (no exposed ports needed on
  # `app` if you go through Caddy). Set APP_DOMAIN to your live domain.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    profiles: ["proxy"]

  # Automatic local backups (keeps BACKUP_KEEP copies in drivelocal-backups),
  # every BACKUP_INTERVAL_HOURS. For off-site protection set the BACKUP_S3_*
  # vars to any S3-compatible bucket — a copy of the safety audit trail leaves
  # the box so a dead machine never loses it.
  backup:
    build: .
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      DB_FILE: /data/drivelocal.sqlite
      UPLOADS_DIR: /data/uploads
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-6}"
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
      BACKUP_S3_ENDPOINT: "${BACKUP_S3_ENDPOINT:-}"
      BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:-}"
      BACKUP_S3_KEY: "${BACKUP_S3_KEY:-}"
      BACKUP_S3_SECRET: "${BACKUP_S3_SECRET:-}"
      BACKUP_S3_REGION: "${BACKUP_S3_REGION:-us-east-1}"
      BACKUP_S3_PREFIX: "${BACKUP_S3_PREFIX:-drivelocal}"
    volumes:
      - drivelocal-data:/data:ro
      - drivelocal-backups:/app/backups
    command: node src/scripts/backup-loop.js

volumes:
  drivelocal-data:
  drivelocal-backups:
  caddy-data:
  caddy-config: